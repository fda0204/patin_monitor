<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart P!CO{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { margin: 0; }
        .wrapper { display: flex; }

        /* --- Style Sidebar Baru yang Sticky --- */
        .sidebar {
            width: 250px;
            background-color: #212529;
            color: #fff;
            padding: 20px;
            flex-shrink: 0;
            transition: width 0.3s ease;
            overflow-x: hidden;
            
            /* INI BAGIAN PENTINGNYA */
            position: sticky; /* Membuat sidebar "nempel" */
            top: 0;           /* Nempel di bagian paling atas layar */
            height: 100vh;    /* Tingginya selalu 100% dari tinggi layar */
            align-self: flex-start; /* Mencegah flexbox 'stretch' yang bisa mengganggu sticky */
        }
        .sidebar.collapsed {
            width: 80px;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .sidebar-header h4 {
            color: #ffc107;
            margin: 0;
            white-space: nowrap;
        }
        .sidebar.collapsed .sidebar-header h4 {
            display: none;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
        }
        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            margin: 15px 0;
            padding: 10px;
            font-size: 1.1em;
            white-space: nowrap;
            border-radius: 5px;
        }
        .sidebar a:hover {
            background-color: #343a40;
            color: #ffc107;
        }
        .sidebar a .bi {
            margin-right: 15px;
            font-size: 1.3em;
        }
        .sidebar.collapsed a .link-text {
            display: none;
        }
        .sidebar.collapsed a {
            justify-content: center;
        }
        .sidebar.collapsed a .bi {
            margin-right: 0;
        }

        /* --- Style Konten Utama --- */
        .content {
            flex-grow: 1;
            padding: 20px 30px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h4><i class="bi bi-droplet-half"></i> <span class="link-text">Smart P!CO</span></h4>
                <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
            </div>
            <hr>
            <a href="/"><i class="bi bi-grid-1x2-fill"></i> <span class="link-text">Dashboard</span></a>
            <a href="/info"><i class="bi bi-info-circle-fill"></i> <span class="link-text">Informasi Alat</span></a>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });
    </script>
</body>
</html>
